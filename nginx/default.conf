server {
    listen 80;
    
    # Proxy requests to Next.js Frontend
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy requests to Go Backend API
    location /api/ {
        # Rewrite /api/(.*) to /$1 before passing to backend
        # rewrite ^/api/(.*) /$1 break; 
        # OR if backend expects /api prefix, just pass it.
        # Assuming backend expects /api prefix or we strip it. 
        # Let's check backend routes. If main.go has /api group, we don't rewrite.
        # If not, we might need rewrite.
        # Usually standard is /api stays /api.
        
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy uploaded files
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
