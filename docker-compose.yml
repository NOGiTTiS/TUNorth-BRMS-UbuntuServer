services:
  backend:
    build: ./backend
    container_name: brms-backend
    restart: always
    networks:
      - tunorth-net
    volumes:
      - ../../data/uploads/brms:/app/uploads
    environment:
      - DB_HOST=${DB_HOST:-brms-db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-hVLcvCI17kc.r6XZ}
      - DB_NAME=${DB_NAME:-tunorth-brms_db}
      - DB_PORT=${DB_PORT:-5432}
      - PORT=8080
      - ALLOW_ORIGINS=${ALLOW_ORIGINS:-*}
      - JWT_SECRET=${JWT_SECRET:-tunorth-brms-jwt-super-secret-key-2026}
      - DB_SSL=disable

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    container_name: brms-frontend
    restart: always
    networks:
      - tunorth-net
    environment:
      - API_INTERNAL_URL=http://brms-backend:8080
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    depends_on:
      - backend

networks:
  tunorth-net:
    external: true
